<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Rota People">
  <!--
    Família de marcas SAL HUB — grade 48, raio 13, símbolo em traço 2.75.
    Cores tiradas da identidade do próprio Rota People: azul #152C6D e o
    vermelho #D7192F que a marca usa como acento.
    "Sua jornada, no mapa": a rota sobe até o ponto marcado no destino.
  -->
  <defs>
    <linearGradient id="people" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D3C84" />
      <stop offset="1" stop-color="#101F4E" />
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="13" fill="url(#people)" />

  <!-- percurso -->
  <path
    d="M15 33.5 C15 26 24 27 24 20.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.75"
    stroke-linecap="round"
    opacity="0.5"
  />

  <!-- origem -->
  <circle cx="15" cy="33.5" r="2.75" fill="#ffffff" opacity="0.75" />

  <!-- destino: pino do mapa, no vermelho da marca -->
  <path
    d="M31 11.5 C34.9 11.5 38 14.6 38 18.5 C38 23.4 31 30 31 30 C31 30 24 23.4 24 18.5 C24 14.6 27.1 11.5 31 11.5 Z"
    fill="#D7192F"
  />
  <circle cx="31" cy="18.5" r="2.9" fill="#ffffff" />
</svg>
