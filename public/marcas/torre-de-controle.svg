<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Torre de Controle">
  <!--
    Família de marcas SAL HUB — grade 48, raio 13, símbolo branco.
    Torre de controle de tráfego: base larga, fuste, cabine envidraçada e
    antena, com o sinal saindo dos dois lados. Vermelho da SAL, a mesma cor
    que o painel usa.
  -->
  <defs>
    <linearGradient id="torre" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2242F" />
      <stop offset="1" stop-color="#8E0D18" />
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="13" fill="url(#torre)" />

  <!-- sinal captado, mais aberto que a cabine para não se confundir com ela -->
  <g fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" opacity="0.5">
    <path d="M13.2 13.8 C10.4 16.9 10.4 21.5 13.2 24.6" />
    <path d="M34.8 13.8 C37.6 16.9 37.6 21.5 34.8 24.6" />
  </g>

  <!-- antena -->
  <rect x="23.1" y="8.2" width="1.8" height="5.2" rx="0.9" fill="#ffffff" />

  <!-- cabine: mais larga que o fuste e achatada, é o que define a torre -->
  <path d="M17.1 13.4 H30.9 L28.9 21.2 H19.1 Z" fill="#ffffff" />

  <!-- fuste -->
  <path d="M20.4 21.2 H27.6 L28.9 33.6 H19.1 Z" fill="#ffffff" opacity="0.93" />

  <!-- base -->
  <path d="M15.4 38.4 L17.4 33.6 H30.6 L32.6 38.4 Z" fill="#ffffff" />
</svg>
